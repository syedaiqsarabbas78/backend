services:
  - type: web
    name: harbor-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: ALLOWED_ORIGINS
        value: https://frontend-qxsn.vercel.app
      - key: OPENAI_MODEL_CANDIDATES
        value: gpt-4.1-mini,gpt-4o-mini
      - key: OPENAI_TIMEOUT_MS
        value: "60000"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "1024"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
